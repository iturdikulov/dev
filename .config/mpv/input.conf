l seek 5
h seek -5
j seek -60
k seek 60
S cycle sub
# Cyrillic-layout aliases for the bindings above (physical H/J/K/L/S keys).
д seek 5
р seek -5
о seek -60
л seek 60
Ы cycle sub
Shift+tab  script-binding uosc/toggle-ui
tab script-message-to uosc toggle-elements timeline,speed,top_bar
ALT+k add window-scale 0.05
ALT+j add window-scale -0.05
ALT+r run yt-dlp "${path}" -o ~/Videos/record/mpv-%(title)s.%(ext)s; show_text "Downloading ${filename}"
ALT+л add window-scale 0.05
ALT+о add window-scale -0.05
ALT+к run yt-dlp "${path}" -o ~/Videos/record/mpv-%(title)s.%(ext)s; show_text "Downloading ${filename}"
c run "/bin/sh" "-c" "echo -n \"${path}\" | wl-copy"
с run "/bin/sh" "-c" "echo -n \"${path}\" | wl-copy"

# Standard mpv bindings in a Russian keyboard layout.  Bindings overridden
# above retain their customised behavior (e.g. р/о/л/д and Ы/с).
й quit
Й quit-watch-later
з cycle pause
ш script-binding stats/display-stats
Ш script-binding stats/display-stats-toggle
я add sub-delay -0.1
Я add sub-delay 0.1
ч add sub-delay 0.1
П add sub-scale 0.1
А add sub-scale -0.1
ь cycle mute
и cycle deband
в cycle deinterlace
к add sub-pos -1
К add sub-pos 1
е add sub-pos 1
м cycle sub-visibility
ALT+м cycle secondary-sub-visibility
М cycle sub-ass-use-video-data
г cycle-values sub-ass-override "force" "scale"
О cycle sub down
Е cycle ontop
а cycle fullscreen
ы screenshot
CTRL+ы screenshot window
ALT+ы screenshot each-frame
ц add panscan -0.1
Ц add panscan 0.1
у add panscan 0.1
Ф cycle-values video-aspect-override "16:9" "4:3" "2.35:1" "no"
У cycle edition
Д cycle-values loop-file "inf" "no"
CTRL+р cycle-values hwdec "no" "auto"
CTRL+ц quit
CTRL+с quit 4
CTRL+м loadfile ${clipboard/text} append-play; show-text '+ ${clipboard/text}'

# Standard g-… selection menu, with g represented by п.
п ignore
п-з script-binding select/select-playlist
п-ы script-binding select/select-sid
п-Ы script-binding select/select-secondary-sid
п-ф script-binding select/select-aid
п-м script-binding select/select-vid
п-е script-binding select/select-track
п-с script-binding select/select-chapter
п-у script-binding select/select-edition
п-д script-binding select/select-subtitle-line
п-в script-binding select/select-audio-device
п-р script-binding select/select-watch-history
п-ц script-binding select/select-watch-later
п-и script-binding select/select-binding
п-к script-binding select/show-properties
п-ь script-binding select/menu
