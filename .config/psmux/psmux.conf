# psmux.conf - Windows port of ~/.config/tmux/tmux.conf (psmux, tmux-compatible)
# psmux loads this only when ~/.psmux.conf, ~/.psmuxrc and ~/.tmux.conf are absent.
# Dropped Linux-only parts: zsh shell, swap_pane.sh, sesh/fzf-tmux popups,
# tmux_cht.sh, entr helpers, TPM plugins (tmux-fingers, prefix-highlight).
########################################

set -g default-shell powershell

set -g allow-passthrough on
set -g prediction-dimming off    # psmux-specific: don't dim predicted text (Neovim)

setw -g automatic-rename on
set  -g renumber-windows on
set  -g detach-on-destroy on
set  -g base-index 1
setw -g pane-base-index 1
set  -g display-time 1500
set  -g display-panes-time 800
set  -s escape-time 5
set  -g history-limit 50000
set  -g status-interval 5
setw -g aggressive-resize off
set  -s focus-events on
set  -g mouse on

########################################
# Theme (from tmux_theme.conf)         #
########################################

set -g status-position bottom
set -g status-justify centre
set -g status-style bg=default
set -g status-fg colour8

set -g status-left-length 40
set -g status-left "#[fg=green]#S #[fg=colour1]#{?window_zoomed_flag,[Z],}"
set -g status-right "#[fg=colour28]#H"
set -g status-right-length 30

setw -g window-status-current-style fg=magenta
set -g message-style fg=magenta,bg=colour236
set -g message-command-style fg=blue,bg=black

set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity on
set -g bell-action none

setw -g clock-mode-colour colour135
set -g pane-border-style fg=colour235
set -g pane-active-border-style fg=colour5
setw -g window-status-current-format ' #I:#W '
setw -g window-status-format ' #I:#W '
setw -g window-status-activity-style fg=colour240,bg=default

setw -g window-active-style bg=terminal
setw -g window-style bg=colour234

########################################
# Keybinds                             #
########################################

set -g status-keys vi
set -g mode-keys   vi
set -s set-clipboard on

bind t new-window      -c "#{pane_current_path}"
bind c new-window      -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

bind -n M-n next-window
bind -n M-p previous-window
bind N swap-window -t +1 \; next-window
bind P swap-window -t -1 \; previous-window

# Vim-aware pane switching (vim-tmux-navigator); no `ps` on Windows, so match
# the pane's current command instead
bind-key -n 'M-h' if-shell -F "#{m:*vim*,#{pane_current_command}}" 'send-keys M-h' 'select-pane -L'
bind-key -n 'M-j' if-shell -F "#{m:*vim*,#{pane_current_command}}" 'send-keys M-j' 'select-pane -D'
bind-key -n 'M-k' if-shell -F "#{m:*vim*,#{pane_current_command}}" 'send-keys M-k' 'select-pane -U'
bind-key -n 'M-l' if-shell -F "#{m:*vim*,#{pane_current_command}}" 'send-keys M-l' 'select-pane -R'

bind-key -T copy-mode-vi 'M-h' select-pane -L
bind-key -T copy-mode-vi 'M-j' select-pane -D
bind-key -T copy-mode-vi 'M-k' select-pane -U
bind-key -T copy-mode-vi 'M-l' select-pane -R

bind -r C-M-k resize-pane -U 4
bind -r C-M-j resize-pane -D 4
bind -r C-M-h resize-pane -L 4
bind -r C-M-l resize-pane -R 4

# swap_pane.sh replacement: plain swaps with neighbours
bind H swap-pane -U
bind L swap-pane -D

bind o resize-pane -Z
bind S choose-session
bind W choose-window
bind / choose-session
bind . choose-window -F "#{window_index}: #{window_name}" "join-pane -h -t %%"

# Close without confirmation: quit Vim gracefully, otherwise kill the pane
bind-key x if-shell -F "#{m:*vim*,#{pane_current_command}}" \
    "send-keys Escape : q Enter" \
    "kill-pane"
bind X kill-window
bind Q kill-server

bind = select-layout even-vertical
bind + select-layout even-horizontal
bind - break-pane
bind _ join-pane

bind r source-file ~/.config/psmux/psmux.conf \; display-message "  Config reloaded.."
bind R refresh-client

# Documentation & todo list
bind -r M-t neww -c "#{pane_current_path}" "nvim IN_TODO.md"
bind -r M-r neww -c "#{pane_current_path}" "nvim README.md"
bind -r T   neww -c "#{pane_current_path}" "nvim TODO.md"

########################################
# Copy mode                            #
########################################

bind Enter copy-mode
bind b list-buffers
bind B choose-buffer
bind p paste-buffer

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi M-v send-keys -X rectangle-toggle \; send -X begin-selection
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi M-g send-keys -X cancel
bind -T copy-mode-vi H send-keys -X start-of-line
bind -T copy-mode-vi L send-keys -X end-of-line
bind -T copy-mode-vi y send -X copy-selection

########################################
# Russian layout (from tmux_ru_layout.conf)
########################################

bind е new-window -c "#{pane_current_path}"                         # t
bind с new-window -c "#{pane_current_path}"                         # c
bind м split-window -h -c "#{pane_current_path}"                    # v
bind ы split-window -v -c "#{pane_current_path}"                    # s
bind ц choose-tree -Zw                                              # w
bind в detach-client                                                # d
bind а command-prompt { find-window -Z "%%" }                       # f
bind д last-window                                                  # l
bind т next-window                                                  # n
bind з paste-buffer                                                 # p
bind и list-buffers                                                 # b
bind я resize-pane -Z                                               # z
bind щ resize-pane -Z                                               # o
bind й display-panes                                                # q
bind ч confirm-before -p "kill-pane #P? (y/n)" kill-pane            # x
bind к source-file ~/.config/psmux/psmux.conf \; display-message "  Config reloaded..."  # r

bind Е neww -c "#{pane_current_path}" "nvim TODO.md"                # T
bind Т swap-window -t +1 \; next-window                             # N
bind З swap-window -t -1 \; previous-window                         # P
bind Р swap-pane -U                                                 # H
bind Д swap-pane -D                                                 # L
bind Ы choose-session                                               # S
bind Ц choose-window                                                # W
bind Ч kill-window                                                  # X
bind Й kill-server                                                  # Q
bind К refresh-client                                               # R
bind И choose-buffer                                                # B

bind ю choose-window -F "#{window_index}: #{window_name}" "join-pane -h -t %%"  # .

bind-key -T copy-mode-vi р send-keys -X cursor-left                  # h
bind-key -T copy-mode-vi о send-keys -X cursor-down                  # j
bind-key -T copy-mode-vi л send-keys -X cursor-up                    # k
bind-key -T copy-mode-vi д send-keys -X cursor-right                 # l
bind-key -T copy-mode-vi н send-keys -X copy-selection               # y
bind-key -T copy-mode-vi Р send-keys -X start-of-line                # H
bind-key -T copy-mode-vi Д send-keys -X end-of-line                  # L

########################################
# F12: toggle prefix/status (nested sessions)
########################################

bind -n F12 \
    set prefix None \;\
    set key-table off \;\
    set status off \;\
    refresh-client -S

bind -T off F12 \
    set -u prefix \;\
    set -u key-table \;\
    set status on \;\
    refresh-client -S
