# User PATH for GUI sessions (GNOME/KDE/any DM via systemd --user).
# This is one of a pair. A hand-kept copy of ~/.shpaths, which covers every shell and is where the
# list is normally edited; the two must be changed together. This file is KEY=value and cannot source
# a shell script, yet run-or-raise / .desktop need the same directories to find bare names (godot,
# blender, mpv, …) without absolute paths. Applies after re-login (or: systemctl --user daemon-reload
# && log out).
#
# Drift check — prints nothing when the two lists agree, and names the directory that exists but is
# missing from ~/.shpaths otherwise. Run it after editing either list:
#
#   comm -23 \
#     <(grep '^PATH=' ~/.config/environment.d/60-path.conf | sed 's|^PATH=||; s|\$HOME|'"$HOME"'|g' \
#         | tr ':' '\n' | grep -v '^\$PATH$' | sort -u) \
#     <(env -i HOME="$HOME" PATH=/usr/local/bin:/usr/bin:/bin sh -c '. "$HOME/.shpaths"; echo $PATH' \
#         | tr ':' '\n' | sort -u) \
#     | while IFS= read -r d; do [ -d "$d" ] && echo "DRIFT: $d"; done
#
# Unlike ~/.shpaths, this list cannot test whether a directory exists: systemd expands the value
# without running code, so absent directories stay listed here and are merely skipped there.
#
# Skipped (shell-only / dynamic): Idea versioned /opt path. npm is not skipped: its global
# prefix lives in $HOME/.nvm/global instead of the versioned node directory, so CLIs survive
# a node upgrade. PATH lists ~/.local/share/npm-global/bin — a symlink to that prefix's bin/,
# because `nvm use` strips every $NVM_DIR/* entry from PATH. Only node itself is versioned,
# and runs/07_node keeps the ~/.local/share/nvm-current symlink in step with it.

PATH=$HOME/.local/bin:$HOME/.local/share/nvm-current/bin:$HOME/.local/share/npm-global/bin:$HOME/az:$HOME/az/scripts/agent-sandbox/host:$HOME/.local/scripts:$HOME/.local/scrcpy:$HOME/.local/cling/bin:$HOME/.local/go/bin:$HOME/.config/nnn/plugins:$HOME/.local/tmux/bin:$HOME/scripts:/usr/local/go/bin:$HOME/.cargo/bin:/usr/sbin:/usr/local/games:/usr/games:$PATH
# `npm i -g` must target the shared prefix, not the versioned node directory. The path has to
# stay inside $NVM_DIR: `nvm use` rejects any other prefix (nvm_die_on_prefix in nvm.sh).
NPM_CONFIG_PREFIX=$HOME/.nvm/global
