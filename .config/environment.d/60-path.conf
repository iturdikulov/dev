# User PATH for GUI sessions (GNOME/KDE/any DM via systemd --user).
# Mirrors ~/.zshrc addToPathFront so run-or-raise / .desktop can use bare names
# (godot, blender, mpv, …) without absolute paths.
# Applies after re-login (or: systemctl --user daemon-reload && log out).
#
# Skipped (shell-only / dynamic): nvm default node, Idea versioned /opt path.

PATH=$HOME/.local/bin:$HOME/az:$HOME/az/scripts/agent-sandbox/host:$HOME/.bun/bin:$HOME/.local/scripts:$HOME/.local/scrcpy:$HOME/.local/cling/bin:$HOME/.local/npm/bin:$HOME/.local/go/bin:$HOME/.local/.npm-global/bin:$HOME/.config/nnn/plugins:$HOME/.local/tmux/bin:$HOME/.local/whisper/bin:$HOME/scripts:/usr/local/go/bin:$HOME/.cargo/bin:/usr/sbin:/usr/games:/usr/local/games:$PATH
