# User PATH for GUI sessions (GNOME/KDE/any DM via systemd --user).
# Mirrors ~/.zshrc addToPathFront so run-or-raise / .desktop can use bare names
# (godot, blender, mpv, …) without absolute paths.
# Applies after re-login (or: systemctl --user daemon-reload && log out).
#
# Skipped (shell-only / dynamic): Idea versioned /opt path. npm is not skipped: its global
# prefix lives in $HOME/.nvm/global instead of the versioned node directory, so CLIs survive
# a node upgrade. PATH lists ~/.local/share/npm-global/bin — a symlink to that prefix's bin/,
# because `nvm use` strips every $NVM_DIR/* entry from PATH. Only node itself is versioned,
# and runs/07_node keeps the ~/.local/share/nvm-current symlink in step with it.

PATH=$HOME/.local/bin:$HOME/.local/share/nvm-current/bin:$HOME/.local/share/npm-global/bin:$HOME/az:$HOME/az/scripts/agent-sandbox/host:$HOME/.local/scripts:$HOME/.local/scrcpy:$HOME/.local/cling/bin:$HOME/.local/go/bin:$HOME/.config/nnn/plugins:$HOME/.local/tmux/bin:$HOME/scripts:/usr/local/go/bin:$HOME/.cargo/bin:/usr/sbin:/usr/games:/usr/local/games:$PATH
# `npm i -g` must target the shared prefix, not the versioned node directory. The path has to
# stay inside $NVM_DIR: `nvm use` rejects any other prefix (nvm_die_on_prefix in nvm.sh).
NPM_CONFIG_PREFIX=$HOME/.nvm/global
