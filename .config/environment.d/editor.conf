# Editor for everything that never sources ~/.zshrc: systemd user units, .desktop
# launchers, and tmux sessions started as a command (`tmux new -s pi_1 … az-agent pi`).
# pi's Ctrl+G ($VISUAL → $EDITOR → hardcoded fallback) lands on nano without these.
# Applies after re-login (or: systemctl --user daemon-reload && log out).
EDITOR=nvim
VISUAL=nvim
