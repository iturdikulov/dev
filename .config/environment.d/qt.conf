# qgnomeplatform: dark GNOME chrome for Qt5 and Qt6 (sioyek/zeal/nomacs).
# xdgdesktopportal is fine on Qt6 but Qt5's portal plugin has no Appearance
# support, so Qt5 apps stay light Fusion under it — hence gnome globally,
# not a per-app wrapper.
QT_QPA_PLATFORMTHEME=gnome

# Adwaita dropped dialog-ok / dialog-cancel / dialog-ok-apply; Qt then paints
# built-in Fusion XPMs. breeze-dark has light glyphs for dark UIs
# (kf6-breeze-icon-theme).
QT_QPA_SYSTEM_ICON_THEME=breeze-dark

# Same widget metrics as nomacs (Breeze menus) for all Qt apps — qgnomeplatform
# otherwise draws smaller GNOME-styled menus.
QT_STYLE_OVERRIDE=Breeze
