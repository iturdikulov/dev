# Дубли prefix-привязок для русской раскладки (ЙЦУКЕН).
# Те же физические клавиши, что латинские bind в tmux.conf; комментарий — EN.

# --- окна и панели ---
bind е new-window -c "#{pane_current_path}"                         # t
bind с if-shell '[ "#{session_name}" = "az" ]' \
  'run-shell -b "$HOME/.local/scripts/tmux_az_new_window.sh"' \
  'new-window -c "#{pane_current_path}"'                            # c
bind м split-window -h -c "#{pane_current_path}"                    # v
bind ы split-window -v -c "#{pane_current_path}"                    # s
bind ц choose-tree -Zw                                              # w
bind в detach-client                                                # d
bind а command-prompt { find-window -Z "%%" }                       # f
bind д last-window                                                  # l
bind т next-window                                                  # n
bind з paste-buffer                                                 # p
bind и list-buffers                                                 # b
bind я resize-pane -Z                                               # z
bind щ resize-pane -Z                                               # o
bind й display-panes                                                # q
bind ч confirm-before -p "kill-pane #P? (y/n)" kill-pane            # x
bind к source-file ~/.config/tmux/tmux.conf \; display-message "  Config reloaded..."  # r
bind ш run-shell "tmux neww tmux_cht.sh"                            # i

# --- Shift ---
bind Е neww -c "#{pane_current_path}" "[[ -e TODO.md ]] && $EDITOR TODO.md"  # T
bind Т swap-window -t +1 \; next-window                             # N
bind З swap-window -t -1 \; previous-window                         # P
bind Р run 'swap_pane.sh left'                                      # H
bind О run 'swap_pane.sh down'                                      # J
bind Л run 'swap_pane.sh up'                                        # K
bind Д run 'swap_pane.sh right'                                     # L
bind Ь run 'swap_pane.sh master'                                    # M
bind Ы choose-session                                               # S
bind Ц choose-window                                                # W
bind Ч run-shell -b "$HOME/.local/scripts/tmux_graceful_kill_window.sh"  # X
bind Й kill-server                                                  # Q
bind К refresh-client                                               # R
bind И choose-buffer                                                # B

# Физическая клавиша EN-/ → RU-. (choose-session / join-pane)
bind . choose-session
bind ю choose-window -F "#{window_index}: #{window_name}" "join-pane -h -t %%"

# --- copy-mode vi (hjkl и др.) ---
bind-key -T copy-mode-vi р send-keys -X cursor-left                  # h
bind-key -T copy-mode-vi о send-keys -X cursor-down                  # j
bind-key -T copy-mode-vi л send-keys -X cursor-up                    # k
bind-key -T copy-mode-vi д send-keys -X cursor-right                 # l
bind-key -T copy-mode-vi н send-keys -X copy-selection               # y
bind-key -T copy-mode-vi Р send-keys -X start-of-line                # H
bind-key -T copy-mode-vi Д send-keys -X end-of-line                  # L
