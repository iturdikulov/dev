[Settings]
# Тему, курсоры, звуки, gtk-modules и dpi задаёт рабочий стол (GNOME: gsettings
# через XSettings), поэтому здесь их нет: зашитые значения уводили запуск без
# GNOME на неустановленную Breeze, чужие курсоры и dpi 192.
# Шрифт и набор иконок зашиты намеренно — они нужны и сеансам без рабочего стола.
gtk-application-prefer-dark-theme=1
gtk-decoration-layout=icon:minimize,maximize,close
gtk-enable-animations=true
gtk-font-name=Noto Sans,  10
gtk-icon-theme-name=breeze-dark
