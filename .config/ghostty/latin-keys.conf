# lazydocker has hardcoded Latin keys (no config aliases). Force Latin from
# physical keys so ЙЦУКЕН acts like QWERTY — same idea as tmux_ru_layout.
keybind = KeyA=text:a
keybind = KeyB=text:b
keybind = KeyC=text:c
keybind = KeyD=text:d
keybind = KeyE=text:e
keybind = KeyF=text:f
keybind = KeyG=text:g
keybind = KeyH=text:h
keybind = KeyI=text:i
keybind = KeyJ=text:j
keybind = KeyK=text:k
keybind = KeyL=text:l
keybind = KeyM=text:m
keybind = KeyN=text:n
keybind = KeyO=text:o
keybind = KeyP=text:p
keybind = KeyQ=text:q
keybind = KeyR=text:r
keybind = KeyS=text:s
keybind = KeyT=text:t
keybind = KeyU=text:u
keybind = KeyV=text:v
keybind = KeyW=text:w
keybind = KeyX=text:x
keybind = KeyY=text:y
keybind = KeyZ=text:z
keybind = shift+KeyA=text:A
keybind = shift+KeyB=text:B
keybind = shift+KeyC=text:C
keybind = shift+KeyD=text:D
keybind = shift+KeyE=text:E
keybind = shift+KeyF=text:F
keybind = shift+KeyG=text:G
keybind = shift+KeyH=text:H
keybind = shift+KeyI=text:I
keybind = shift+KeyJ=text:J
keybind = shift+KeyK=text:K
keybind = shift+KeyL=text:L
keybind = shift+KeyM=text:M
keybind = shift+KeyN=text:N
keybind = shift+KeyO=text:O
keybind = shift+KeyP=text:P
keybind = shift+KeyQ=text:Q
keybind = shift+KeyR=text:R
keybind = shift+KeyS=text:S
keybind = shift+KeyT=text:T
keybind = shift+KeyU=text:U
keybind = shift+KeyV=text:V
keybind = shift+KeyW=text:W
keybind = shift+KeyX=text:X
keybind = shift+KeyY=text:Y
keybind = shift+KeyZ=text:Z
keybind = BracketLeft=text:[
keybind = BracketRight=text:]
keybind = shift+BracketLeft=text:{
keybind = shift+BracketRight=text:}
keybind = Slash=text:/
keybind = shift+Slash=text:?
