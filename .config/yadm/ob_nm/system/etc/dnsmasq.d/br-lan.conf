# ob_nm router: DHCP + DNS for the LAN bridge.
# dnsmasq binds only to br-lan (192.168.1.1), so it does not clash with any
# stub resolver on 127.0.0.53.
interface=br-lan
bind-interfaces
# Do not treat /etc/hosts entries pointing at 127.0.0.x as answers for clients.
localise-queries
domain-needed
bogus-priv

# Local LAN domain: hostname from DHCP → hostname.lan (not forwarded upstream).
domain=lan
local=/lan/
expand-hosts
dhcp-option=option:domain-search,lan

# Router itself.
address=/ob.lan/192.168.1.1
address=/ob/192.168.1.1

# Upstream DNS: Mihomo split-DNS (TUN gateway). Falls back if mihomo is down.
no-resolv
server=127.0.0.1#7874
server=77.88.8.8
server=77.88.8.1

# DHCP pool for LAN clients.
dhcp-range=192.168.1.100,192.168.1.200,12h
# Advertise the router as gateway (option 3) and DNS server (option 6).
dhcp-option=3,192.168.1.1
dhcp-option=6,192.168.1.1
dhcp-authoritative
