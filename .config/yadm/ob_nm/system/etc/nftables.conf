#!/usr/sbin/nft -f
# ob_nm router firewall + NAT.
# LAN is trusted; WAN is untrusted. Masquerade LAN traffic out either WAN.
# NOTE: interface names are hard-coded here to match ob_nm defaults. If you
# change WAN/LAN interfaces in ob_nm.conf, update these definitions too.

flush ruleset

define WAN_IFACES = { "wlp6s0", "enp2s0" }
define LAN_IFACE  = "br-lan"
define TUN_IFACE  = "Meta"

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        iif "lo" accept
        ct state established,related accept
        ct state invalid drop

        # Trust everything coming from the LAN bridge (DHCP, DNS, SSH, mgmt).
        iifname $LAN_IFACE accept

        # Basic ICMP so the router stays diagnosable.
        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop

        # LAN clients: allow forward to WAN uplinks or the Mihomo TUN gateway.
        iifname $LAN_IFACE oifname $WAN_IFACES accept
        iifname $LAN_IFACE oifname $TUN_IFACE accept
        iifname $TUN_IFACE oifname $WAN_IFACES accept

        # Docker (ss-zapret2 and other local containers on 172.16.0.0/12).
        ip saddr 172.16.0.0/12 oifname $WAN_IFACES accept
        ip saddr 172.16.0.0/12 oifname $TUN_IFACE accept
        ip daddr 172.16.0.0/12 iifname $WAN_IFACES ct state established,related accept
        ip daddr 172.16.0.0/12 iifname $TUN_IFACE ct state established,related accept
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}

table ip nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;

        oifname $WAN_IFACES masquerade
    }
}
