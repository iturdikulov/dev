# ob_nm.conf - optional overrides for the router runners.
# Uncomment and edit any value; lib.sh sources this after setting defaults.
# NOTE: interface names and the LAN subnet are also hard-coded in the static
# files under system/ (dnsmasq, nftables). Change both if you deviate here.

# WAN_WIFI="wlp6s0"
# WAN_WIRED="enp2s0"
# LAN_IFACES="enp3s0 enp4s0 enp5s0"
# LAN_BRIDGE="br-lan"
# LAN_ADDR="192.168.1.1"
# LAN_CIDR="24"
# DHCP_START="192.168.1.100"
# DHCP_END="192.168.1.200"
# DHCP_LEASE="12h"
# WIFI_PRIORITY="100"
# WIRED_PRIORITY="10"
# WIFI_ROUTE_METRIC="50"
# WIRED_ROUTE_METRIC="200"
